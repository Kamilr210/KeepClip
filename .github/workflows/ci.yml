# Każdy push i pull request na gałąź csharp uruchamia testy. Wydanie (release.yml)
# powtarza te same kroki, zanim zbuduje instalator.
name: ci

on:
  push:
    branches: ["csharp"]
    paths-ignore: ["keepClip-Web/**", "*.md"]
  pull_request:
    branches: ["csharp"]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Sprawdź tłumaczenia interfejsu
        run: node tests/i18n-check.js

      - name: Testy wyboru programu Docker
        run: node --test tests/docker-cli.test.mjs

      - name: Testy powiązania demo w odtwarzaczu
        run: node --test tests/clip-demo.test.cjs

      - name: Testy xUnit
        run: dotnet test tests/KeepClip.Tests/KeepClip.Tests.csproj -c Release --nologo --logger "trx;LogFileName=results.trx"

      - name: Sprawdź pakowanie licencji i notices
        shell: powershell
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'keepclip-license-publish'
          dotnet publish KeepClip/KeepClip.csproj -c Release -r win-x64 --self-contained true -p:PublicRelease=true -o $publish --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $LASTEXITCODE" }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/license-packaging.Tests.ps1 -PublishDir $publish
          if ($LASTEXITCODE -ne 0) { throw "License packaging checks failed: $LASTEXITCODE" }

      - name: Zachowaj wyniki testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
