name: ci

on:
  push:
    branches: ["csharp"]
  pull_request:
    branches: ["csharp"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            KeepClip/packages.lock.json
            tests/KeepClip.Tests/packages.lock.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Full quality check
        shell: pwsh
        run: ./scripts/quality-check.ps1 -Mode Full

      - name: Save quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            TestResults/quality/**/summary.*
            TestResults/quality/**/report.html
            TestResults/quality/**/report-data.json
            TestResults/quality/**/repair-prompt.txt
            TestResults/quality/**/node-tests.xml
            TestResults/quality/**/*.log
            TestResults/quality/**/*.trx
            TestResults/quality/**/coverage*.xml
            TestResults/quality/**/coverage*.json
            TestResults/quality/**/coverage*.md
            TestResults/quality/**/coverage.html
          if-no-files-found: error
          retention-days: 14
