# Automatyczny release: wypchnięcie tagu "v*" (np. v2.1.0) buduje na czysto
# self-contained publish + instalator Inno Setup i publikuje KeepClip-Setup.exe
# w GitHub Releases. Dzięki temu "exe na GitHubie" nigdy nie jest stary —
# nowy release = jedna komenda: git tag vX.Y.Z && git push origin vX.Y.Z
#
# Czego CI NIE ma z natury (i jak to jest rozwiązane):
#  - ffmpeg/ffprobe (gitignored, za duże) -> pobiera je setup.ps1, ten sam
#    skrypt, którego używa świeży klon na maszynie dewelopera.
#  - installer/embed/google_client.json (dane klienta OAuth, nigdy w repo) ->
#    wymagany sekret repozytorium GOOGLE_CLIENT_JSON_B64 (base64 pliku).
#    Workflow celowo przerywa wydanie, gdy sekretu brakuje lub JSON jest błędny:
#    publiczny instalator ma zawsze prowadzić prosto do logowania Google.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # gh release create

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pobierz ffmpeg (setup.ps1)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File setup.ps1

      - name: Wbuduj klienta OAuth Google (wymagany)
        env:
          GOOGLE_CLIENT_JSON_B64: ${{ secrets.GOOGLE_CLIENT_JSON_B64 }}
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_JSON_B64)) {
            throw "Brak sekretu GOOGLE_CLIENT_JSON_B64. Ustaw go przed utworzeniem publicznego wydania."
          }

          New-Item -ItemType Directory -Force installer\embed | Out-Null
          try {
            $bytes = [Convert]::FromBase64String($env:GOOGLE_CLIENT_JSON_B64)
            [IO.File]::WriteAllBytes("installer\embed\google_client.json", $bytes)
            $json = [Text.Encoding]::UTF8.GetString($bytes) | ConvertFrom-Json
          } catch {
            throw "GOOGLE_CLIENT_JSON_B64 nie zawiera poprawnego pliku JSON zakodowanego base64: $($_.Exception.Message)"
          }

          if ($null -eq $json.installed `
              -or [string]::IsNullOrWhiteSpace($json.installed.client_id) `
              -or [string]::IsNullOrWhiteSpace($json.installed.client_secret)) {
            throw "Sekret musi zawierać klienta Google OAuth typu Desktop app (obiekt installed z client_id i client_secret)."
          }

      - name: Zbuduj publish + instalator
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1 -PublicRelease

      - name: Utwórz release i wgraj instalator
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "installer/dist/KeepClip-Setup.exe#KeepClip-Setup-$env:GITHUB_REF_NAME.exe" `
            --title "KeepClip $env:GITHUB_REF_NAME" `
            --generate-notes
