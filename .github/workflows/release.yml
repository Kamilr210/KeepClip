# Tag v* buduje samowystarczalny instalator i publikuje go w sekcji wydań GitHub.
# FFmpeg jest kompilowany ze zrodel z dolaczonym pakietem odpowiadajacych zrodel, a klient OAuth powstaje z sekretu GOOGLE_CLIENT_JSON_B64.
# Brak lub błędna wartość sekretu celowo przerywa wydanie.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # gh release create

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Zbuduj FFmpeg i komplet odpowiadajacych zrodel
        run: node build/ffmpeg/build.mjs --output "${{ runner.temp }}/ffmpeg-artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-with-source
          path: ${{ runner.temp }}/ffmpeg-artifact/
          compression-level: 0
          retention-days: 7

  build:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      # Zepsuty build nie może trafić do użytkowników: testy biegną przed instalatorem.
      - name: Sprawdź tłumaczenia interfejsu
        run: node tests/i18n-check.js

      - name: Testy wyboru programu Docker
        run: node --test tests/docker-cli.test.mjs

      - name: Testy powiązania demo w odtwarzaczu
        run: node --test tests/clip-demo.test.cjs

      - name: Testy xUnit
        run: dotnet test tests/KeepClip.Tests/KeepClip.Tests.csproj -c Release --nologo

      - name: Testy publicznej konfiguracji OAuth
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/oauth-packaging.Tests.ps1

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-with-source
          path: ${{ runner.temp }}/ffmpeg-artifact

      - name: Przygotuj FFmpeg wraz ze zrodlami (setup.ps1)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File setup.ps1 -BuildArtifactDir "$env:RUNNER_TEMP\ffmpeg-artifact"

      - name: Test FFmpeg na syntetycznym obrazie i audio
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\ffmpeg-smoke.ps1 -WorkDir "$env:RUNNER_TEMP\ffmpeg-smoke"

      - name: Test wycinania przez aplikację z prawdziwym FFmpeg
        run: dotnet test tests/KeepClip.Tests/KeepClip.Tests.csproj -c Release -p:RunFfmpegTests=true --filter Category=FFmpeg --nologo

      - name: Wbuduj klienta OAuth Google (wymagany)
        env:
          GOOGLE_CLIENT_JSON_B64: ${{ secrets.GOOGLE_CLIENT_JSON_B64 }}
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_JSON_B64)) {
            throw "Brak sekretu GOOGLE_CLIENT_JSON_B64. Ustaw go przed utworzeniem publicznego wydania."
          }

          New-Item -ItemType Directory -Force installer\embed | Out-Null
          $rawClient = Join-Path $env:RUNNER_TEMP ('keepclip-oauth-' + [guid]::NewGuid().ToString('N') + '.json')
          try {
            $bytes = [Convert]::FromBase64String($env:GOOGLE_CLIENT_JSON_B64)
            [IO.File]::WriteAllBytes($rawClient, $bytes)
            & ./installer/prepare-public-oauth.ps1 -InputPath $rawClient -OutputPath installer/embed/google_client.json
            & ./installer/prepare-public-oauth.ps1 -InputPath installer/embed/google_client.json -VerifyOnly
          } finally {
            if (Test-Path -LiteralPath $rawClient) { Remove-Item -LiteralPath $rawClient }
          }

      - name: Zbuduj publish + instalator
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1 -PublicRelease

      - name: Sprawdz pakowanie licencji i zrodel
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\license-packaging.Tests.ps1 -PublishDir installer\staging\publish

      - name: Utwórz release i wgraj instalator
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $technicalTag = "materials-$env:GITHUB_REF_NAME"
          $technicalUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$technicalTag"
          $technicalNotes = Join-Path $env:RUNNER_TEMP 'technical-release-notes.md'
          $appNotes = Join-Path $env:RUNNER_TEMP 'app-release-notes.md'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($technicalNotes, "Technical files for KeepClip $env:GITHUB_REF_NAME. This is not an application update.`n`nFFmpeg corresponding sources, build materials and SHA-256 checksums for the installer are attached here. Installers: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME", $utf8)
          $notes = [IO.File]::ReadAllText("docs/releases/$env:GITHUB_REF_NAME.md")
          [IO.File]::WriteAllText($appNotes, $notes + "`n`n[FFmpeg sources and installer checksums]($technicalUrl)", $utf8)

          gh release create $technicalTag `
            "installer/dist/KeepClip-FFmpeg-Source.zip#KeepClip-FFmpeg-Source-$env:GITHUB_REF_NAME.zip" `
            "installer/dist/KeepClip-Setup.provenance.json" `
            --target "$env:GITHUB_SHA" --latest=false `
            --title "KeepClip $env:GITHUB_REF_NAME - Technical files" `
            --notes-file $technicalNotes
          if ($LASTEXITCODE -ne 0) { throw 'Nie udalo sie opublikowac materialow technicznych.' }

          gh release create "$env:GITHUB_REF_NAME" `
            "installer/dist/KeepClip-Setup.exe#KeepClip-Setup-$env:GITHUB_REF_NAME.exe" `
            --title "KeepClip $env:GITHUB_REF_NAME" `
            --verify-tag --latest `
            --notes-file $appNotes
          if ($LASTEXITCODE -ne 0) { throw 'Nie udalo sie opublikowac instalatora.' }
